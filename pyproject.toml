[build-system]
requires = ["setuptools>=77",
            "setuptools_scm[toml]>=7",
            # needed to compile the gettext (.po -> .mo) translation catalogs
            # at build time (see setup.py / setup.cfg [compile_catalog])
            "Babel>=2.18.0",
            "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-nik"
description = "Site Planning and Observation Tool"
readme = "README.md"
authors = [{name = "SPOT Maintainers", email = "ocs@naoj.org"}]
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
keywords = ["site", "telescope", "astronomy", "observation", "planning", "plugins"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dynamic = ["version"]
dependencies = [
    "astropy>=7.2.1",
    "jplephem>=2.24",
    "numpy>=2.0",
    "skyfield>=1.53",
    "python-dateutil>=2.8.2",
    "matplotlib>=3.8",
    "ginga>=7.3.0",
]

[project.scripts]
spot = "spot.main:_main"

[project.urls]
Homepage = "https://github.com/naojsoft/spot"

[project.optional-dependencies]
test = [
    "pytest",
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
]
pg = [
    "websockets",
    "pgwidgets-js>=0.4.0",
    "pgwidgets-python>=0.4.0",
    "pycairo>=1.28.0",
    "cairosvg>=2.9.0",
]

[tool.setuptools]
zip-safe = false
include-package-data = true
# NOTE: the 'spot' launcher is now a console_scripts entry point (see
# [project.scripts] above); pip generates the platform launcher (incl.
# spot.exe on Windows), so scripts/spot and scripts/spot.bat are retired.
script-files = ["scripts/pam_w.py"]

[tool.setuptools.packages.find]
# include the data-only dirs (spot/config, spot/examples, the per-language
# spot/locale/*/{LC_MESSAGES,docs}) whose files are shipped via package-data
# but which carry no __init__.py; scope discovery to spot* so nothing outside
# the package (doc/, tests/) is picked up
include = ["spot*"]
namespaces = true

[tool.setuptools.package-data]
"spot.examples" = ["*.py"]
"spot.icons" = ["*.svg", "*.png"]
"spot.config" = ["*.yml", "*.fits", "*.json"]
"spot.doc" = ["*.md", "*.rst", "*.yml", "*.txt"]
# gettext catalogs: the .po sources are tracked, the .mo files are compiled
# at build time (see setup.py); whole-document help translations live under
# <lang>/docs/
"spot.locale" = ["*/LC_MESSAGES/*.po", "*/LC_MESSAGES/*.mo", "*/docs/*/*.rst"]

[tool.setuptools_scm]
write_to = "spot/version.py"
version_scheme = "release-branch-semver"

[tool.ruff]
# match the historical flake8 line length
line-length = 79

[tool.ruff.lint]
# pycodestyle (E/W) + pyflakes (F), to mirror the previous flake8 setup
select = ["E", "W", "F"]
# Ignoring these (carried over from the old [flake8] config):
# E265: block comment should start with '#'
# E266: too many leading '#' for block comment
# E402: module level import not at top of file
# E501: line too long
# E741: ambiguous variable name 'l'
# F841: local variable is assigned to but never used
# (flake8's E129, I100/I101 and W504 are not implemented by ruff, so dropped)
ignore = ["E265", "E266", "E402", "E501", "E741", "F841"]
