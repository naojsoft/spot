# Configuration for Babel's gettext catalog commands (used via pybabel and,
# for compile_catalog, by setup.py's build_py at build time).  Project
# metadata otherwise lives in pyproject.toml.

[extract_messages]
# NOTE: prefer `python -m spot.locale._extract`, which also extracts
# build_info() caption titles that a plain keyword scan misses.
input_dirs = spot
output_file = spot/locale/spot.pot
keywords = _tr _ N_

[init_catalog]
domain = spot
input_file = spot/locale/spot.pot
output_dir = spot/locale

[update_catalog]
domain = spot
input_file = spot/locale/spot.pot
output_dir = spot/locale

[compile_catalog]
domain = spot
directory = spot/locale
